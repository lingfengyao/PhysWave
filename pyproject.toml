[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physwave-inference"
version = "0.1.0"
description = "Text and waypoint conditioned first-order ambisonics generation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
physwave = "physwave.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["physwave*", "stable_audio_tools*"]
